<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4eee5"><meta name="description" content="QRコードの上に、小さなtutuがやってくる。"><title>tutu — 会いにいこう</title></head>
<body><main id="app"><header><a class="brand" href="./">tutu<span>AR EXPERIENCE</span></a><a class="pill" href="?marker" target="_blank" rel="noopener">読み取り用QR ↗</a></header>
<section id="experience"><div id="viewport"><video id="video" autoplay muted playsinline></video><div id="render"></div></div><div class="shade"></div><div class="intro"><span class="eyebrow">A LITTLE HELLO IN YOUR WORLD</span><h1>ここに、<br>tutuがいる。</h1><p>QRコードにカメラを向けてみて。<br>小さな友だちが、手を振ります。</p></div><div id="reticle"><i></i><i></i><i></i><i></i></div><div class="bottom"><div class="status"><span id="dot"></span><span id="status" role="status" aria-live="polite">カメラを準備しています</span></div><p id="hint">QRコード全体を映してください</p><button id="camera-button" hidden>カメラを起動する</button><button id="retry-model" hidden>tutuを再読み込み</button></div></section>
<footer><span>ひとつのQRから、はじまる出会い。</span><span id="model-status">tutuを準備中…</span></footer></main>
<section id="marker-page" hidden><a class="brand" href="./">tutu<span>YOUR LITTLE FRIEND</span></a><h1>ここで、会おう。</h1><p>このQRを別の画面に表示するか、印刷して<br>AR画面のカメラを向けてください。</p><div class="marker-card"><canvas id="qr"></canvas><strong>HELLO, TUTU</strong><span>手を振る / WAVE</span></div><p class="note">白い余白も含めて、平らに置いてください。</p><button onclick="window.print()">QRコードを印刷</button><a class="back" href="./">AR画面へ戻る →</a></section>
